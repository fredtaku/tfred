receivers:
  otlp:
    protocols:
      grpc:
      http:
processors:
  batch: {}
  resource:
    attributes:
      - key: LOB
        value: "finance"         # Replace with LOB
        action: upsert
      - key: environment
        value: "prod"            # Replace with ENV field
        action: upsert
exporters:
  splunk_hec:
    token: "<YOUR_SPLUNK_HEC_TOKEN>"
    endpoint: "Error! Hyperlink reference not valid."
    source: "otel"
    sourcetype: "_json"
    index: "main"
    tls:
      insecure_skip_verify: true
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [splunk_hec]
    metrics:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [splunk_hec]
    logs:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [splunk_hec]
